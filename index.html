<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Grid - Professional</title>
    <style>
        /* الأساسيات للشاشات الكبيرة (تظل كما هي) */
        body {
            margin: 0; padding: 10px;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            scrollbar-width: none;
            overflow-y: hidden;
        }
        h1 { color: #2154ef; margin: -10px 0 10px 1px; font-size: 25px; }
        
        .grid-container {
            display: grid;
            width: 2000vmax; /* العرض الضخم للكمبيوتر */
            height: 100vh;
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            overflow-x: auto;
            gap: 15px;
            margin: 0 auto;
        }

        .media-item {
            position: relative;
            aspect-ratio: 16/9;
            background-color: #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .media-link { display: block; width: 100%; height: 100%; text-decoration: none; }
        .media-link img, .media-link video { width: 100%; height: 100%; object-fit: cover; }

        .media-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 15px; color: white;
        }
        
        /* --- تصميم الهاتف (Responsive & Modern) --- */
        @media (max-width: 768px) {
            body { 
                overflow-y: auto !important; 
                background-color: #ffffff; /* خلفية نظيفة للهاتف */
            }
            .grid-container {
                width: 100% !important; /* إلغاء العرض الضخم */
                display: flex;
                flex-direction: column;
                height: auto;
                gap: 20px;
                padding-bottom: 80px;
            }
            .media-item {
                aspect-ratio: 4/5; /* شكل طولي احترافي للهاتف */
                margin: 0 10px;
                border-radius: 20px; /* زوايا دائرية أكثر */
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            }
            .media-overlay {
                padding: 20px;
                background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            }
            .media-overlay h3 { font-size: 18px !important; margin-bottom: 8px; }
            .media-overlay p { font-size: 13px !important; opacity: 0.8; }
            
            /* تحسين شكل السعر */
            .media-stats span {
                background: rgba(33, 84, 239, 0.9);
                padding: 5px 12px;
                border-radius: 50px;
                font-weight: bold;
                font-size: 14px;
            }
        }

        /* تنسيقات الأزرار العائمة */
        .add, .floating-contact { position: fixed; bottom: 20px; z-index: 1000; }
        .add { left: 20px; }
        .floating-contact { right: 20px; }
        .contact-button img, .add img {
            width: 55px; height: 55px; border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(33, 84, 239, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(33, 84, 239, 0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>Capslank</h1>
    <div class="grid-container" id="media-container">
        <div class="loading">Loading Amazing Content...</div>
    </div>

    <div class="add">
        <a href="#"><img src="add-button.png" alt="Add"></a>
    </div>
    <div class="floating-contact">
        <a href="https://wa.me/2001551839053"><img src="a6c948cc6e551b08e70453d97bec0bc9.png" alt="WhatsApp"></a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mediaContainer = document.getElementById('media-container');
            
            // محاكاة تحميل البيانات (استبدلها بـ fetch 'products.json')
            fetch('products.json')
                .then(res => res.json())
                .then(data => {
                    renderMedia(data.products);
                    setupIntersectionObserver(); // Virtual Scroll Logic
                });

            function renderMedia(products) {
                mediaContainer.innerHTML = products.map(item => `
                    <div class="media-item" data-id="${item.id}">
                        <a href="product.html?id=${item.id}" class="media-link">
                            ${item.type === 'video' 
                                ? `<video class="lazy-video" muted playsinline loop poster="pp.jpg">
                                     <source src="${item.source}" type="video/mp4">
                                   </video>` 
                                : `<img src="${item.source}" loading="lazy">`
                            }
                            <div class="media-overlay">
                                <h3>${item.title}</h3>
                                <p>${item.description || ''}</p>
                                <div class="media-stats">
                                    <span>${item.price} ج.م</span>
                                </div>
                            </div>
                        </a>
                    </div>
                `).join('');
            }

            // Virtual Scroll / Performance Logic
            function setupIntersectionObserver() {
                const options = { threshold: 0.6 }; // تشغيل الفيديو عند ظهور 60% منه
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const video = entry.target.querySelector('video');
                        if (!video) return;

                        if (entry.isIntersecting) {
                            video.play().catch(() => {}); // تشغيل تلقائي في الهاتف عند المرور
                        } else {
                            video.pause();
                            video.currentTime = 0;
                        }
                    });
                }, options);

                document.querySelectorAll('.media-item').forEach(item => observer.observe(item));
            }
        });
    </script>
</body>
</html>
