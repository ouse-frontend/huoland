<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Grid</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            /* overflow: auto; */
            /* transform: scale(1.2);
            transform-origin: top left ; */
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow-y: hidden;

        
            
        }
        h1 {
            color: #2154ef;
            display: none;
        }
        span sup{
            color:hsl(240, 74%, 57%); 
            text-shadow:1px 1px 1px hsl(127, 67%, 91%) ;
            
        }

        html::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
            
        }

        .grid-container {
            display: grid;
            width:2000vmax;
            height:100% ;
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            overflow-x: auto;
            
            gap: 10px;
            /* max-width: 1800px; */
            margin: 0 auto;
        }

        .media-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px hwb(234 17% 9% / 0.802);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .media-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0, 119, 255, 0.3), 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .media-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
             
        }
        
        .media-link img,
        .media-link video {
            width: 100%;
            height: 100%;
            object-fit:cover;
            transition: opacity 0.3s ease;
        }
        
        .media-link:hover img,
        .media-link:hover video {
            opacity: 0.9;
        }

        .media-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            padding: 20px;
            color: white;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        .media-item:hover .media-overlay {
            opacity: 0;
        }
        @media (max-width: 768px) {
            .media-item {
                height: calc(100vh/5);
                aspect-ratio: 9/9;
            }
            html{
                padding: 0;
                overflow-y: hidden;
            }
            body{
                padding: 5px;
            }
            
        }

        .media-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 10px;
            font-weight: 600;
        }

        .media-overlay p {
            margin: 0 0 8px 0;
            font-size: 8px;
            opacity: 0.9;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 2.4em;
            line-height: 1.2em;
        }
        
        @supports (-webkit-line-clamp: 2) {
            .media-overlay p {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
        }

        .media-stats {
            display: flex;
            gap: 12px;
            font-size: 14px;
            opacity: 0.8; 
        }

        .media-stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .media-item:hover .media-overlay {
            padding-bottom: 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            color: #666;
            grid-column: 1 / -1;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            padding: 20px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <h1 style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-size: 25px; margin: -10px 0 0 1px;">Capslank</h3>
    <div class="grid-container" id="media-container">
        <div class="loading">Loading media...</div>
    </div>



       <!-- i added it in 21 december 2025 -->
    <div class="floating-contact">
      <a href="https://signal.me/#p/+2001551839053" target="_blank" class="contact-button">
        <img src="a6c948cc6e551b08e70453d97bec0bc9.png" alt="Contact Us" />
      </a>
    </div>

     <div class="add">
      <a href="https://gemini.google.com/app/e0156cd04a971687?is_sa=1&is_sa=1&android-min-version=301356232&ios-min-version=322.0&campaign_id=bkws&utm_source=sem&utm_source=google&utm_medium=paid-media&utm_medium=cpc&utm_campaign=bkws&utm_campaign=2024arEG_gemfeb&pt=9008&mt=8&ct=p-growth-sem-bkws&gclsrc=aw.ds&gad_source=1&gad_campaignid=20437330728&gbraid=0AAAAApk5BhluBB6VXVSZKHzpYme3rStpt&gclid=Cj0KCQiA0p7KBhCkARIsAE6XlalQ94TqqcuGQuyUqO8bJAx3zFMLEdCscv9F3_-Rzj7q46bn9yddGzUaAkiJEALw_wcB" target="_blank" class="contact-button">
        <img src="add-button.png" alt="Contact Us" />
      </a>
    </div>

    <style>
        .add {position: fixed;bottom: 20px; /* المسافة من الأسفل */left: 20px; /* المسافة من اليمين */z-index: 1000; /* لضمان ظهوره فوق بقية العناصر */}
      .floating-contact {position: fixed;bottom: 20px; /* المسافة من الأسفل */right: 20px; /* المسافة من اليمين */z-index: 1000; /* لضمان ظهوره فوق بقية العناصر */}
      .contact-button img , .add img {width: 60px; /* حجم الزر */height: 60px;border-radius: 50%; /* لجعله دائرياً */box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3); /* إضافة ظل */transition: transform 0.3s ease; /* حركة ناعمة عند التفاعل */}
      /* تأثير عند تمرير الماوس فوق الزر */
      .contact-button img:hover , .add img:hover {transform: scale(1.1); /* تكبير الزر قليلاً */}
      @keyframes pulse {0% {box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5);}70% {box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);}100% {box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);}}
      .contact-button img , .add img {animation: pulse 2s infinite; /* تشغيل حركة النبض باستمرار */}
     </style>
    

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mediaContainer = document.getElementById('media-container');
            
            // Fetch media from JSON file
            fetch('products.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Clear loading message
                    mediaContainer.innerHTML = '';
                    
                    // Create media items
                    data.products.forEach(item => {
                        const mediaItem = document.createElement('div');
                        mediaItem.className = 'media-item';
                        
                        // Determine media type (image or video)
                        const isVideo = item.type === 'video';
                        const mediaElement = isVideo 
                            ? `
                                <div class="video-container media-link">
                                    <video class="media-video" muted preload="none" loading="lazy" poster="pp.jpg">
                                        <source src="${item.source}" type="video/mp4">
                                        Your browser does not support the video tag.
                                    </video>
                                </div>
                            `
                            : `<img src="${item.source}" alt="${item.title}" class="media-image" loading="lazy" >`;
                        
                        mediaItem.innerHTML = `
                            <a href="product.html?id=${item.id}" class="media-link">
                                ${mediaElement}
                                <div class="media-overlay">
                                    <h3>${item.title}</h3>
                                    ${item.description ? `<p>${item.description.replace(/<[^>]*>?/gm, '').substring(0, 100)}${item.description.length > 100 ? '...' : ''}</p>` : ''}
                                    ${item.price ? `<div class="media-stats">
                                        <span><sup>ج.م</sup>${item.price.toFixed(0)}</span>
                                    </div>` : ''}
                                </div>
                            </a>
                        `;
                        
                        mediaContainer.appendChild(mediaItem);
                    });

                    // Handle hover play/pause for videos
                    const mediaItems = document.querySelectorAll(".media-item");
                    

                    mediaItems.forEach((item) => {
                        const video = item.querySelector("video");
                        if (!video) return; // Skip if no video in this item
                        
                        // Ensure video is visible and sized correctly
                        video.style.width = '100%';
                        video.style.height = '100%';
                        video.style.objectFit = 'cover';
                        
                        // Mute and set volume to 0 to ensure no sound plays
                        video.muted = true;
                        video.volume = 0;
                        video.playsInline = true;
                        
                        // Pause video initially
                        video.pause();

                        // Play on hover anywhere in the media item
                        item.addEventListener("mouseenter", () => {
                            video.currentTime = 0;
                            video.play().catch((e) => {
                                console.log("Video play failed:", e);
                                video.controls = false; // Show controls if autoplay fails
                            });
                        });

                        // Pause and reset when not hovering
                        item.addEventListener("mouseleave", () => {
                            video.pause();
                            video.currentTime = 0;
                        });
                        
                        // When video ends, reset to start
                        video.addEventListener('ended', () => {
                            video.currentTime = 0;
                        });
                    });
                })
                .catch(error => {
                    console.error('Error loading media:', error);
                    mediaContainer.innerHTML = `
                        <div class="error">
                            Failed to load media. Please try again later.
                            <p>${error.message}</p>
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
