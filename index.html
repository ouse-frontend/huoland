<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض صور ديناميكي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        
        /* معرض الصور فقط */
        .gallery-container {
            padding: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .gallery {
            columns: 2;
            column-gap: 15px;
        }
        
        @media (min-width: 768px) {
            .gallery {
                columns: 3;
            }
        }
        
        @media (min-width: 1200px) {
            .gallery {
                columns: 4;
            }
        }
        
        .image-card {
            break-inside: avoid;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #222;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        
        .image-card:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.3s;
        }
        
        .image-card:hover img {
            opacity: 0.9;
        }
        
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .image-card:hover .image-overlay {
            opacity: 1;
        }
        
        .image-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .image-author {
            font-size: 12px;
            color: #ccc;
        }
        
        /* صفحة المنتج */
        .product-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 1000;
            overflow-y: auto;
        }
        
        .product-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        
        .back-button {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
            text-decoration: none;
        }
        
        .back-button:hover {
            background: #444;
        }
        
        .product-title {
            font-size: 24px;
            font-weight: bold;
        }
        
        .product-body {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        @media (min-width: 992px) {
            .product-body {
                flex-direction: row;
            }
        }
        
        .product-image-container {
            flex: 1;
            min-width: 300px;
        }
        
        .product-image {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .product-details {
            flex: 1;
            min-width: 300px;
        }
        
        .product-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .meta-value {
            font-size: 20px;
            font-weight: bold;
        }
        
        .meta-label {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .product-description {
            line-height: 1.8;
            font-size: 16px;
            color: #ccc;
            margin-bottom: 30px;
        }
        
        .product-info {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .info-section {
            margin-bottom: 20px;
        }
        
        .info-section:last-child {
            margin-bottom: 0;
        }
        
        .info-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .info-content {
            font-size: 15px;
            color: #ccc;
            line-height: 1.6;
        }
        
        .info-list {
            list-style-type: none;
        }
        
        .info-list li {
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .info-list li:last-child {
            border-bottom: none;
        }
        
        .comments-section {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
        }
        
        .comment {
            padding: 15px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .comment:last-child {
            border-bottom: none;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .comment-author {
            font-weight: bold;
        }
        
        .comment-date {
            color: #aaa;
            font-size: 14px;
        }
        
        .comment-text {
            color: #ccc;
            line-height: 1.5;
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        
        .tag {
            background-color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        /* رابط المشاركة */
        .share-link {
            margin-top: 20px;
            padding: 15px;
            background-color: #1a1a1a;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .share-link a {
            color: #4dabf7;
            text-decoration: none;
            word-break: break-all;
        }
        
        .share-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- معرض الصور فقط -->
    <div class="gallery-container">
        <div class="gallery" id="gallery">
            <!-- سيتم إضافة الصور ديناميكياً -->
        </div>
    </div>
    
    <!-- صفحة المنتج (ستظهر عند النقر على صورة) -->
    <div class="product-page" id="productPage">
        <!-- سيتم بناؤها ديناميكياً بالكامل -->
    </div>

    <script>
        // بيانات الصور والمنتجات
        const images = [
            {
                id: 1,
                slug: "منظر-طبيعي-خلاب",
                title: "منظر طبيعي خلاب",
                author: "أحمد المصور",
                image: "https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80",
                likes: 2450,
                downloads: 1200,
                views: 18900,
                description: "منظر طبيعي خلاب يظهر جمال الطبيعة في أوج تألقها. تم التقاط هذه الصورة في ساعات الشروق الأولى حيث تتلألأ أشعة الشمس على قمم الجبال. تكشف الصورة عن تفاصيل دقيقة للأشجار والصخور والمياه الجارية، مما يخلق مشهداً هادئاً ومريحاً للنفس.",
                details: "تم التقاط هذه الصورة بكاميرا احترافية من نوع Nikon D850 مع عدسة 24-70mm. الإعدادات: f/8، سرعة الغالق 1/125 ثانية، ISO 100. التصوير تم في إضاءة طبيعية دون استخدام فلاش.",
                location: "جبال الألب السويسرية",
                date: "15 مايو 2023",
                equipment: "Nikon D850، عدسة 24-70mm f/2.8، حامل ثلاثي القوائم",
                tags: ["طبيعة", "جبال", "شروق", "مناظر طبيعية", "هدوء"],
                comments: [
                    { author: "سارة", date: "2023-06-10", text: "كم هي رائعة هذه الصورة! الألوان تخلق جوًا ساحرًا." },
                    { author: "خالد", date: "2023-06-08", text: "التفاصيل مذهلة، يمكنني رؤية كل ورقة شجرة تقريبًا." },
                    { author: "نورة", date: "2023-06-05", text: "أحببت توزيع الضوء في هذه الصورة، محترف حقًا." }
                ]
            },
            {
                id: 2,
                slug: "عمارة-حديثة",
                title: "عمارة حديثة",
                author: "ليلى المعماري",
                image: "https://images.unsplash.com/photo-1487958449943-2429e8be8625?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80",
                likes: 1870,
                downloads: 890,
                views: 15400,
                description: "تصميم معماري حديث يجمع بين الخطوط المستقيمة والمنحنيات اللطيفة. يظهر المبنى بتصميم فريد يعكس الذوق المعماري المعاصر مع الحفاظ على الوظائف العملية. الزجاج والمعادن تشكل العناصر الرئيسية في هذا التصميم الذي يبرز تحت سماء زرقاء صافية.",
                details: "التصوير تم بعدسة واسعة الزاوية 16-35mm على كاميرا Sony A7III. الإعدادات: f/11، سرعة الغالق 1/200 ثانية، ISO 200. تم معالجة الصورة لتعزيز التباين والألوان.",
                location: "دبي، الإمارات العربية المتحدة",
                date: "22 أبريل 2023",
                equipment: "Sony A7III، عدسة 16-35mm f/4، فلتر استقطاب",
                tags: ["عمارة", "حديث", "تصميم", "مدينة", "زجاج"],
                comments: [
                    { author: "محمد", date: "2023-05-30", text: "التصميم المعماري مذهل، الخطوط نظيفة جدًا." },
                    { author: "فاطمة", date: "2023-05-28", text: "أحببت تناسق الألوان في هذه الصورة." }
                ]
            },
            {
                id: 3,
                slug: "وجبة-شهية",
                title: "وجبة شهية",
                author: "طارق الشيف",
                image: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80",
                likes: 3210,
                downloads: 1560,
                views: 23400,
                description: "وجبة طعام شهية تظهر تفاصيل الألوان والمكونات بدقة عالية. تبرز الصورة نضارة المكونات وتناسق الألوان الذي يجعل الوجبة جذابة للغاية. الإضاءة الطبيعية تسلط الضوء على تفاصيل الطعام وتبرز قوام المكونات المختلفة.",
                details: "تم إعداد الإضاءة باستخدام softbox كبير من الجانب الأيسر مع عاكس من الجانب الأيمن. الكاميرا: Canon EOS R5 مع عدسة 100mm ماكرو. الإعدادات: f/5.6، سرعة الغالق 1/160 ثانية، ISO 400.",
                location: "مطعم فاخر في إسطنبول",
                date: "10 مارس 2023",
                equipment: "Canon EOS R5، عدسة 100mm f/2.8L ماكرو، إضاءة صناعية",
                tags: ["طعام", "وجبة", "صحة", "طازج", "ألوان"],
                comments: [
                    { author: "يوسف", date: "2023-04-15", text: "الصورة تجعلني أشعر بالجوع رغم أنني أكلت للتو!" },
                    { author: "هناء", date: "2023-04-12", text: "الإضاءة مثالية لإظهار تفاصيل الطعام." },
                    { author: "عمر", date: "2023-04-10", text: "الألوان طبيعية جدًا، لا توجد مبالغة في المعالجة." }
                ]
            }
        ];

        // إعداد نظام التوجيه (Routing)
        function initRouter() {
            // قراءة الرابط الحالي
            const path = window.location.hash.substring(1);
            
            if (path.startsWith('image/')) {
                // استخراج معرف الصورة من الرابط
                const slug = path.replace('image/', '');
                const image = images.find(img => img.slug === slug);
                
                if (image) {
                    // عرض صفحة الصورة مباشرة
                    openProductPage(image.id);
                } else {
                    // إذا لم يتم العثور على الصورة، العودة إلى المعرض
                    window.location.hash = '';
                }
            } else {
                // عرض المعرض إذا لم يكن هناك رابط صورة
                closeProductPage();
            }
        }

        // تحديث الرابط عند فتح صفحة صورة
        function updateUrlForImage(imageSlug) {
            window.location.hash = `image/${imageSlug}`;
        }

        // العودة إلى الرابط الرئيسي
        function resetUrl() {
            window.location.hash = '';
        }

        // توليد معرض الصور عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('gallery');
            
            // إنشاء بطاقات الصور مع روابط
            images.forEach(image => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.id = image.id;
                
                card.innerHTML = `
                    <img src="${image.image}" alt="${image.title}" loading="lazy">
                    <div class="image-overlay">
                        <div class="image-title">${image.title}</div>
                        <div class="image-author">${image.author}</div>
                    </div>
                `;
                
                // إضافة حدث النقر لفتح صفحة المنتج مع تحديث الرابط
                card.addEventListener('click', function() {
                    openProductPage(image.id);
                    updateUrlForImage(image.slug);
                });
                
                gallery.appendChild(card);
            });
            
            // تهيئة نظام التوجيه
            initRouter();
            
            // الاستماع لتغييرات الرابط
            window.addEventListener('hashchange', initRouter);
        });

        // فتح صفحة المنتج
        function openProductPage(imageId) {
            const image = images.find(img => img.id === imageId);
            if (!image) return;
            
            // إنشاء عناصر صفحة المنتج
            const productPage = document.getElementById('productPage');
            
            // إنشاء محتوى صفحة المنتج كاملة
            productPage.innerHTML = `
                <div class="product-content">
                    <div class="product-header">
                        <a href="#" class="back-button" id="backButton">
                            <span>←</span> العودة للمعرض
                        </a>
                        <h1 class="product-title">${image.title}</h1>
                    </div>
                    
                    <div class="product-body">
                        <div class="product-image-container">
                            <img src="${image.image}" alt="${image.title}" class="product-image">
                            <div class="share-link">
                                <strong>رابط هذه الصورة:</strong><br>
                                <a href="${window.location.origin}${window.location.pathname}#image/${image.slug}" id="pageLink">
                                    ${window.location.origin}${window.location.pathname}#image/${image.slug}
                                </a>
                                <br><br>
                                <small>يمكنك نسخ هذا الرابط ومشاركته مع الآخرين</small>
                            </div>
                            <div class="tags" style="margin-top: 20px;">
                                ${image.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                        
                        <div class="product-details">
                            <div class="product-meta">
                                <div class="meta-item">
                                    <div class="meta-value">${image.likes.toLocaleString()}</div>
                                    <div class="meta-label">إعجاب</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-value">${image.downloads.toLocaleString()}</div>
                                    <div class="meta-label">تحميل</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-value">${image.views.toLocaleString()}</div>
                                    <div class="meta-label">مشاهدة</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-value">${image.author}</div>
                                    <div class="meta-label">المصور</div>
                                </div>
                            </div>
                            
                            <p class="product-description">${image.description}</p>
                            
                            <div class="product-info">
                                <div class="info-section">
                                    <h3 class="info-title">تفاصيل التصوير</h3>
                                    <p class="info-content">${image.details}</p>
                                </div>
                                
                                <div class="info-section">
                                    <h3 class="info-title">معلومات تقنية</h3>
                                    <ul class="info-list">
                                        <li><strong>الموقع:</strong> ${image.location}</li>
                                        <li><strong>التاريخ:</strong> ${image.date}</li>
                                        <li><strong>المعدات:</strong> ${image.equipment}</li>
                                    </ul>
                                </div>
                            </div>
                            
                            <div class="comments-section">
                                <h3 class="info-title">التعليقات (${image.comments.length})</h3>
                                ${image.comments.map(comment => `
                                    <div class="comment">
                                        <div class="comment-header">
                                            <span class="comment-author">${comment.author}</span>
                                            <span class="comment-date">${comment.date}</span>
                                        </div>
                                        <p class="comment-text">${comment.text}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // عرض صفحة المنتج
            productPage.style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            // إضافة حدث إغلاق صفحة المنتج
            document.getElementById('backButton').addEventListener('click', function(e) {
                e.preventDefault();
                closeProductPage();
                resetUrl();
            });
            
            // إضافة زر نسخ الرابط
            const pageLink = document.getElementById('pageLink');
            pageLink.addEventListener('click', function(e) {
                e.preventDefault();
                copyToClipboard(this.href);
                alert('تم نسخ الرابط إلى الحافظة!');
            });
        }

        // إغلاق صفحة المنتج
        function closeProductPage() {
            const productPage = document.getElementById('productPage');
            productPage.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // دالة مساعدة لنسخ النص إلى الحافظة
        function copyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
