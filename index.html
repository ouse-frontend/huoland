<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Grid</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            transform: scale(1.2);
            transform-origin: top left;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar { display: none; }

        h1 {
            color: #2154ef;
            display: none;
        }

        span sup {
            color: hsl(240, 74%, 57%);
            text-shadow: 1px 1px 1px hsl(127, 67%, 91%);
        }

        .grid-container {
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding: 10px 0;
            box-sizing: border-box;
        }

        .virtual-row {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            grid-auto-columns: minmax(300px, 1fr);
            gap: 10px;
            padding-left: 10px;
            padding-right: 100vw; /* عشان الـ scroll يوصل للآخر */
            height: 100%;
        }

        .media-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .media-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0, 119, 255, 0.3), 0 5px 15px rgba(0,0,0,0.3);
        }

        .media-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }

        .media-link img,
        .media-link video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .media-link:hover img,
        .media-link:hover video { opacity: 0.9; }

        .media-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            padding: 20px;
            color: white;
            transition: opacity 0.3s ease;
        }

        .media-item:hover .media-overlay { opacity: 0; }

        .media-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 10px;
            font-weight: 600;
        }

        .media-overlay p {
            margin: 0 0 8px 0;
            font-size: 8px;
            opacity: 0.9;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2em;
        }

        .media-stats {
            display: flex;
            gap: 12px;
            font-size: 14px;
            opacity: 0.8;
        }

        .media-stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .loading, .error {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            white-space: normal;
        }

        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1 style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-size: 25px; margin: -10px 0 0 1px;">Capslank</h1>
    <div class="grid-container" id="media-container">
        <div class="loading">Loading media...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('media-container');
            let products = [];

            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                products = data.products;
            } catch (err) {
                container.innerHTML = `<div class="error">Failed to load products: ${err.message}</div>`;
                console.error(err);
                return;
            }

            if (products.length === 0) {
                container.innerHTML = '<div class="error">No products found.</div>';
                return;
            }

            // إعدادات الـ Virtual Scrolling
            const ITEM_WIDTH = 310; // تقريبي (300px + gap 10px)
            const ROWS = 5;
            const VISIBLE_COLUMNS = Math.ceil(window.innerWidth / ITEM_WIDTH) + 2; // +2 buffer
            const POOL_SIZE = VISIBLE_COLUMNS * ROWS * 2; // عدد العناصر اللي هنعمل recycle ليها (كفاية كبيرة)

            // إنشاء pool من العناصر مرة واحدة
            const pool = [];
            const virtualRow = document.createElement('div');
            virtualRow.className = 'virtual-row';
            container.innerHTML = '';
            container.appendChild(virtualRow);

            for (let i = 0; i < POOL_SIZE; i++) {
                const item = document.createElement('div');
                item.className = 'media-item';
                item.innerHTML = `
                    <a href="#" class="media-link">
                        <img src="" alt="" loading="lazy" style="display:none;">
                        <video muted playsinline preload="none" style="display:none;"></video>
                        <div class="media-overlay">
                            <h3></h3>
                            <p></p>
                            <div class="media-stats"><span><sup>ج.م</sup>0</span></div>
                        </div>
                    </a>
                `;
                virtualRow.appendChild(item);
                pool.push(item);
            }

            let startIndex = 0;

            const render = () => {
                const scrollLeft = container.scrollLeft;
                const newStartCol = Math.floor(scrollLeft / ITEM_WIDTH);
                startIndex = newStartCol * ROWS;

                pool.forEach((item, i) => {
                    const dataIndex = startIndex + i;
                    if (dataIndex < products.length) {
                        const product = products[dataIndex];
                        const link = item.querySelector('.media-link');
                        const img = item.querySelector('img');
                        const video = item.querySelector('video');
                        const overlay = item.querySelector('.media-overlay');
                        const h3 = overlay.querySelector('h3');
                        const p = overlay.querySelector('p');
                        const priceSpan = overlay.querySelector('.media-stats span');

                        // تحديث الرابط
                        link.href = `product.html?id=${product.id}`;

                        // إما صورة أو فيديو
                        if (product.type === 'video') {
                            img.style.display = 'none';
                            video.style.display = 'block';
                            video.querySelector('source')?.remove();
                            const source = document.createElement('source');
                            source.src = product.source;
                            source.type = 'video/mp4';
                            video.appendChild(source);
                            video.load();
                        } else {
                            video.style.display = 'none';
                            img.style.display = 'block';
                            img.src = product.source;
                            img.alt = product.title;
                        }

                        // تحديث النصوص
                        h3.textContent = product.title;
                        p.textContent = product.description ? product.description.replace(/<[^>]*>?/gm, '').substring(0, 100) + (product.description.length > 100 ? '...' : '') : '';
                        p.style.display = p.textContent ? 'block' : 'none';
                        if (product.price) {
                            priceSpan.innerHTML = `<sup>ج.م</sup>${product.price.toFixed(0)}`;
                            priceSpan.parentElement.style.display = 'flex';
                        } else {
                            priceSpan.parentElement.style.display = 'none';
                        }

                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });

                // تحديث عرض الـ virtual row عشان الـ scrollbar يبقى صح
                virtualRow.style.width = `${Math.ceil(products.length / ROWS) * ITEM_WIDTH}px`;
            };

            // Hover play/pause للفيديوهات
            virtualRow.addEventListener('mouseenter', (e) => {
                const item = e.target.closest('.media-item');
                if (!item) return;
                const video = item.querySelector('video');
                if (video && video.style.display !== 'none') {
                    video.currentTime = 0;
                    video.play().catch(() => {});
                }
            }, true);

            virtualRow.addEventListener('mouseleave', (e) => {
                const item = e.target.closest('.media-item');
                if (!item) return;
                const video = item.querySelector('video');
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                }
            }, true);

            // Scroll event مع debounce بسيط
            let ticking = false;
            container.addEventListener('scroll', () => {
                if (!ticking) {
                    requestAnimationFrame(() => {
                        render();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // Resize support
            window.addEventListener('resize', render);

            // أول render
            render();
        });
    </script>
</body>
</html>
