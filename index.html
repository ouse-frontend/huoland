<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capslank - Premium Grid</title>
    <style>
        :root {
            --primary: #2154ef;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --card-w: 350px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* خلفية داكنة لإبراز الميديا */
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* حاوية العرض الرئيسية */
        #main-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
        }

        .logo { font-size: 28px; font-weight: bold; color: var(--primary); letter-spacing: 1px; }

        /* حاوية السكرول العرضي */
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 15px;
            padding: 20px;
            scrollbar-width: none;
            position: relative;
        }

        .grid-container::-webkit-scrollbar { display: none; }

        /* تصميم كارت المنتج */
        .media-item {
            position: absolute; /* ضروري للـ Virtual Scroll */
            width: var(--card-w);
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            cursor: pointer;
            contain: strict;
        }

        .media-item:hover {
            transform: scale(1.05) translateY(-5px);
            z-index: 50;
            box-shadow: 0 10px 30px rgba(33, 84, 239, 0.4);
        }

        .media-link img, .media-link video {
            width: 100%; height: 100%; object-fit: cover;
        }

        .media-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 15px;
            transition: 0.3s;
        }

        .media-item:hover .media-overlay { opacity: 0; }

        /* صفحة تفاصيل المنتج (المخفية) */
        #product-view {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark);
            z-index: 2000;
            display: none; /* مخفي افتراضياً */
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .back-btn {
            background: var(--primary); color: white; border: none;
            padding: 10px 25px; border-radius: 30px; cursor: pointer;
            margin-bottom: 30px; font-weight: bold;
        }

        .product-layout {
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }

        .product-img-container img, .product-img-container video {
            width: 100%; border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .product-layout { grid-template-columns: 1fr; }
            :root { --card-w: 280px; }
        }
    </style>
</head>
<body>

    <div id="main-viewport">
        <header>
            <div class="logo">CAPSLANK</div>
        </header>

        <div class="grid-container" id="media-container">
            <div style="color: var(--primary); padding: 50px;">جاري تحميل المحتوى...</div>
        </div>
    </div>

    <div id="product-view">
        <button class="back-btn" onclick="closeProduct()">← عودة للمجموعة</button>
        <div id="product-content"></div>
    </div>

    <script>
        let allProducts = [];
        const container = document.getElementById('media-container');
        const productView = document.getElementById('product-view');
        
        const COL_GAP = 15;
        const COL_WIDTH = 350 + COL_GAP;
        const ROWS = 5;

        // 1. جلب البيانات
        fetch('products.json')
            .then(res => res.json())
            .then(data => {
                allProducts = data.products;
                initApp();
            })
            .catch(() => {
                container.innerHTML = "خطأ في تحميل البيانات. تأكد من وجود ملف products.json";
            });

        function initApp() {
            renderGrid();
            container.addEventListener('scroll', renderGrid);
            window.addEventListener('resize', renderGrid);
        }

        // 2. محرك الـ Virtual Scroll العرضي
        function renderGrid() {
            const scrollLeft = Math.abs(container.scrollLeft); // دعم الـ RTL
            const viewportWidth = container.offsetWidth;
            
            const totalCols = Math.ceil(allProducts.length / ROWS);
            const totalWidth = totalCols * COL_WIDTH;

            const startCol = Math.floor(scrollLeft / COL_WIDTH);
            const endCol = startCol + Math.ceil(viewportWidth / COL_WIDTH) + 1;

            const startIndex = startCol * ROWS;
            const endIndex = endCol * ROWS;

            const visibleItems = allProducts.slice(startIndex, endIndex);

            container.innerHTML = `
                <div style="width: ${totalWidth}px; height: 1px;"></div>
                ${visibleItems.map((item, i) => {
                    const absIdx = startIndex + i;
                    const col = Math.floor(absIdx / ROWS);
                    const row = absIdx % ROWS;
                    
                    return `
                        <div class="media-item" 
                             style="left: ${col * COL_WIDTH}px; top: ${(row * 20)}%;"
                             onclick="openProduct(${item.id})">
                            <div class="media-link">
                                ${item.type === 'video' 
                                    ? `<video src="${item.source}" muted loop playsinline></video>`
                                    : `<img src="${item.source}" loading="lazy">`
                                }
                                <div class="media-overlay">
                                    <h3>${item.title}</h3>
                                    <span>${item.price} ج.م</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
            
            handleVideos();
        }

        // 3. التحكم في الفيديوهات عند الحوم (Hover)
        function handleVideos() {
            document.querySelectorAll('.media-item').forEach(card => {
                const v = card.querySelector('video');
                if(!v) return;
                card.onmouseenter = () => v.play();
                card.onmouseleave = () => { v.pause(); v.currentTime = 0; };
            });
        }

        // 4. نظام الـ SPA للانتقال لصفحة المنتج
        window.openProduct = function(id) {
            const product = allProducts.find(p => p.id == id);
            if(!product) return;

            const content = document.getElementById('product-content');
            content.innerHTML = `
                <div class="product-layout">
                    <div class="product-img-container">
                        ${product.type === 'video' 
                            ? `<video src="${product.source}" controls autoplay></video>`
                            : `<img src="${product.source}">`
                        }
                    </div>
                    <div class="product-info">
                        <h1 style="font-size: 3rem; margin: 0;">${product.title}</h1>
                        <p style="font-size: 1.5rem; color: var(--primary); font-weight: bold;">${product.price} ج.م</p>
                        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
                        <p style="line-height: 1.8; color: #ccc;">${product.description || 'لا يوجد وصف متاح لهذا المنتج حالياً.'}</p>
                        <button class="back-btn" style="width: 100%; margin-top: 20px;">شراء الآن</button>
                    </div>
                </div>
            `;

            productView.style.display = 'block';
            history.pushState({view: 'product', id: id}, "", `/product/${id}`);
        };

        window.closeProduct = function() {
            productView.style.display = 'none';
            history.pushState({view: 'home'}, "", "/");
        };

        // دعم زر "الخلف" في المتصفح
        window.onpopstate = (e) => {
            if (e.state && e.state.view === 'product') openProduct(e.state.id);
            else closeProduct();
        };

    </script>
</body>
</html>
