<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Grid - Optimized</title>
    <style>
        /* ... نفس تنسيقاتك الأصلية ... */
        body { margin: 0; padding: 10px; background-color: #f0f0f0; font-family: Arial, sans-serif; overflow-y: hidden; }
        
        .grid-container {
            display: grid;
            width: 100%; /* سنغير العرض ليكون ديناميكياً */
            height: calc(100vh - 40px);
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            /* عرض العمود ثابت لتسهيل حسابات الـ Virtual Scroll */
            grid-template-columns: repeat(auto-fill, 350px); 
            overflow-x: auto;
            gap: 10px;
            position: relative;
        }

        /* تحسين أداء الصور والفيديو */
        .media-item {
            width: 350px;
            aspect-ratio: 16/9;
            background-color: #ddd; /* لون مؤقت */
            contain: paint; /* يخبر المتصفح أن محتوى العنصر لن يخرج عن حدوده */
        }

        /* حاوية وهمية لإعطاء مساحة السكرول العرضي */
        #virtual-spacer {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            grid-auto-flow: column;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="grid-container" id="media-container">
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('media-container');
            let allProducts = [];
            const COL_WIDTH = 360; // عرض العمود + الفجوة (Gap)
            const ROWS = 5;

            fetch('products.json')
                .then(res => res.json())
                .then(data => {
                    allProducts = data.products;
                    initVirtualScroll();
                });

            function initVirtualScroll() {
                // 1. حساب العرض الكلي المطلوب
                const totalCols = Math.ceil(allProducts.length / ROWS);
                const totalWidth = totalCols * COL_WIDTH;

                // 2. دالة التحديث عند السكرول
                const render = () => {
                    const scrollLeft = container.scrollLeft;
                    const viewportWidth = container.offsetWidth;

                    // حساب أي الأعمدة التي يجب أن تظهر الآن
                    const startCol = Math.floor(scrollLeft / COL_WIDTH);
                    const endCol = startCol + Math.ceil(viewportWidth / COL_WIDTH) + 1;

                    const startIndex = startCol * ROWS;
                    const endIndex = endCol * ROWS;

                    const visibleProducts = allProducts.slice(startIndex, endIndex);

                    // بناء الـ HTML للعناصر المرئية فقط
                    // نستخدم transform: translateX لوضع العناصر في مكانها الصحيح في السكرول
                    container.innerHTML = `
                        <div style="width: ${totalWidth}px; position: absolute; height: 1px;"></div>
                        ${visibleProducts.map((item, i) => {
                            const currentIdx = startIndex + i;
                            const colNum = Math.floor(currentIdx / ROWS);
                            const rowNum = currentIdx % ROWS;
                            const leftPos = colNum * COL_WIDTH;

                            return `
                                <div class="media-item" style="position: absolute; left: ${leftPos}px; top: ${(rowNum * 20)}%;">
                                    <a href="product.html?id=${item.id}" class="media-link">
                                        ${item.type === 'video' 
                                            ? `<video src="${item.source}" muted loop playsinline poster="pp.jpg"></video>`
                                            : `<img src="${item.source}" loading="lazy">`
                                        }
                                        <div class="media-overlay">
                                            <h3>${item.title}</h3>
                                            <p>${item.price} ج.م</p>
                                        </div>
                                    </a>
                                </div>
                            `;
                        }).join('')}
                    `;
                    
                    setupVideoEvents(); // إعادة تفعيل تشغيل الفيديوهات
                };

                container.addEventListener('scroll', render);
                window.addEventListener('resize', render);
                render(); // تشغيل أولي
            }

            function setupVideoEvents() {
                const videos = document.querySelectorAll('video');
                videos.forEach(v => {
                    v.parentElement.addEventListener('mouseenter', () => v.play());
                    v.parentElement.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
                });
            }
        });
    </script>
</body>
</html>
